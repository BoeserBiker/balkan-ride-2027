name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    # Nur Agenten-PRs aus diesem Repository; Fork-Läufe hätten ohnehin keinen Schreibzugriff.
    if: |
      startsWith(github.event.pull_request.head.ref, 'feature/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: roadbook-preview-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Bewusst main (nicht der PR-Stand): nur vertrauter Runner-Code erhält den Schreibzugriff.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install requests PyYAML
      - name: Vorschaubilder des Issues löschen
        env:
          MODE: cleanup
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python .github/scripts/agent_runner.py
