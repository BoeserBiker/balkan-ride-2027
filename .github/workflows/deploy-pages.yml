name: Deploy Roadbook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: python -m pip install requests PyYAML
      - name: Run Python tests
        run: |
          python -m unittest discover -s .github/scripts -p test_agent_runner.py
          python -m unittest discover -s web/tests -p "test_*.py"
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Run automated tests
        run: node --test web/tests/*.test.js
      - name: Build roadbook
        run: npm run build --prefix web
      - name: Install Chromium for the visual check
        run: npx playwright install --with-deps chromium
        working-directory: web
      # Zweistufiger Rollout (D-8): Solange die Repository-Variable VISUAL_GATE_BLOCKING nicht
      # 'true' ist, wird der erste Linux-Lauf nur gemessen (ein Fehler blockiert den Deploy nicht).
      # Erst nach einem ausgewerteten Lauf wird die Variable gesetzt; dann blockiert das Gate.
      - name: Visual check
        id: visual
        continue-on-error: ${{ vars.VISUAL_GATE_BLOCKING != 'true' }}
        run: npm run test:visual --prefix web
      - name: Save visual report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: web/.visual-report/
          if-no-files-found: warn
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
