name: AI Roadbook 2-Stage Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

env:
  ALLOWED_GITHUB_USER: ${{ vars.ROADBOOK_AGENT_USER }}
  ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
  ISSUE_NUMBER: ${{ github.event.issue.number }}
  REPOSITORY: ${{ github.repository }}

jobs:
  plan-stage:
    if: |
      vars.ROADBOOK_AGENT_USER != '' &&
      (
        (
          github.event_name == 'issues' &&
          github.event.action == 'opened' &&
          github.event.issue.user.login == vars.ROADBOOK_AGENT_USER
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == vars.ROADBOOK_AGENT_USER &&
          contains(github.event.comment.body, '/plan-item')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests anthropic PyYAML
      - run: python -m unittest discover -s .github/scripts -p test_agent_runner.py
      - name: Stufe 1 - Plan erstellen
        env:
          MODE: plan
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_PLAN_MODEL || 'claude-haiku-4-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/agent_runner.py

  implement-generate:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      vars.ROADBOOK_AGENT_USER != '' &&
      github.event.comment.user.login == vars.ROADBOOK_AGENT_USER &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/implement-item')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: roadbook-implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests anthropic PyYAML
      - run: python -m unittest discover -s .github/scripts -p test_agent_runner.py
      - name: Stufe 2a - Änderungen erzeugen und Feature-Branch pushen
        env:
          MODE: implement
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/agent_runner.py

  # Führt den erzeugten Code aus: ohne API-Key, ohne Token-Umgebung und nur mit Leserechten.
  implement-verify:
    needs: implement-generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-${{ github.event.issue.number }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests PyYAML
      - name: Agenten-Tests
        run: python -m unittest discover -s .github/scripts -p test_agent_runner.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Web-Tests
        run: node --test web/tests/*.test.js
      - name: Produktionsbuild
        run: npm run build --prefix web

  implement-publish:
    needs: implement-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests anthropic PyYAML
      - name: Stufe 2b - Diff prüfen und Pull Request eröffnen
        env:
          MODE: publish
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/agent_runner.py

  implement-report:
    needs: implement-verify
    if: ${{ always() && (needs.implement-verify.result == 'failure' || needs.implement-verify.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests anthropic PyYAML
      - name: Fehlschlag melden
        env:
          MODE: report
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/agent_runner.py
